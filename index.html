<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brewed" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Brewed With Code</title>
    <meta name="description" content="A cozy 3D café game you play in your browser. Brew coffee, bake cakes and get to know a town of marshmallows and notebooks. Playable 1 Dec." />
    <!-- link previews (WhatsApp, iMessage, LinkedIn, X, Discord, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brewed With Code" />
    <meta property="og:title" content="Brewed With Code — a cozy café game in your browser" />
    <meta property="og:description" content="Brew coffee, bake cakes and get to know a town of marshmallows and notebooks. Playable 1 Dec." />
    <meta property="og:url" content="https://brewed-with-code.vercel.app/" />
    <meta property="og:image" content="https://brewed-with-code.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The teapot-shaped café on a little street, with a grand fountain in the park across the road" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brewed With Code — a cozy café game in your browser" />
    <meta name="twitter:description" content="Brew coffee, bake cakes and get to know a town of marshmallows and notebooks. Playable 1 Dec." />
    <meta name="twitter:image" content="https://brewed-with-code.vercel.app/og.jpg" />
  </head>
  <body>
    <!-- loading screen (plain HTML: shows while the game's code downloads; fades out once the 3D world is running) -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; background: #291830; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; transition: opacity .6s ease; font-family: 'Trebuchet MS', system-ui, sans-serif; }
      #boot img { width: min(620px, 86vw); height: auto; animation: bootbob 3s ease-in-out infinite; }
      #boot .fact { max-width: min(560px, 86vw); text-align: center; color: #f6e7f0; font-size: clamp(14px, 2.2vw, 18px); line-height: 1.45; }
      #boot .fact b { display: block; color: #f2c66a; font-size: .8em; letter-spacing: .14em; margin-bottom: 6px; }
      #boot .brewing { color: #e98fa6; font-weight: 800; font-size: 14px; letter-spacing: .1em; animation: bootpulse 1.4s ease-in-out infinite; }
      @keyframes bootbob { 50% { transform: translateY(-6px) } }
      @keyframes bootpulse { 50% { opacity: .35 } }
    </style>
    <div id="boot">
      <img src="./title-board.webp" alt="Brewed With Code" />
      <div class="fact"><b>☕ FUN FACT</b><span id="bootfact"></span></div>
      <div class="brewing">BREWING YOUR CAFÉ…</div>
    </div>
    <script>
      (function () {
        if (/embed|snap/.test(location.search)) { document.getElementById('boot').remove(); return }
        var F = [
          'Coffee beans are really the seeds of a bright red fruit called a coffee cherry.',
          'Espresso isn’t a kind of bean. It’s a way of brewing: hot water pushed hard through finely ground coffee.',
          'The cappuccino is named after the Capuchin friars, whose robes were a similar coffee-and-milk brown.',
          'Every townsperson’s face here is rolled from a number, like dice. Same number, same face.',
          'Marshmallows live on the west side of town, notebooks on the east.',
          'Your café is a teapot. And yes, you can walk right inside it.',
          'This whole game runs in your browser: no download, no install.',
          'A latte is mostly milk. Steaming it right gives that silky, glossy texture.'
        ]
        document.getElementById('bootfact').textContent = F[Math.floor(Math.random() * F.length)]
      })()
    </script>
    <!-- embedded in a notes-brain video page (the game tour): borrow its frame-stepped clock -->
    <script>
      if (location.search.includes('embed') && window.parent !== window) {
        const P = window.parent
        performance.now = () => P.performance.now()
        Date.now = () => P.Date.now()
        window.requestAnimationFrame = (f) => P.requestAnimationFrame(f)
        window.cancelAnimationFrame = (id) => P.cancelAnimationFrame(id)
        window.setTimeout = (f, ms, ...a) => P.setTimeout(() => f(...a), ms)
        window.clearTimeout = (id) => P.clearTimeout(id)
        window.setInterval = (f, ms) => P.setInterval(f, ms)
        window.clearInterval = (id) => P.clearInterval(id)
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
